<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Tarefas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --err:#dc2626; --warn:#d97706; --on-accent:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --line:#2a2e36; --accent:#60a5fa; --ok:#4ade80; --err:#f87171; --warn:#fbbf24; --on-accent:#0b1220; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:24px 16px calc(96px + env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { font-size:1.5rem; margin:0; }
  h2 { font-size:1rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:0 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  form.row { display:flex; gap:8px; align-items:center; }
  input[type=text], input[type=email], input[type=password], input[type=number], select { padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  input.grow { flex:1; min-width:0; }
  input[type=color] { flex:none; width:44px; height:42px; padding:2px; border:1px solid var(--line); border-radius:8px; background:var(--bg); cursor:pointer; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:var(--on-accent); font:inherit; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
  button.icon { background:transparent; color:var(--muted); padding:4px 8px; }
  #app { margin-top:20px; }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 8px 8px; background:transparent; color:var(--muted); border-radius:0; border-top:2px solid transparent; font-size:.8rem; }
  nav button .ic { display:flex; }
  nav button.on .ic { color:var(--accent); }
  svg { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  nav button .ic svg { width:24px; height:24px; }
  nav button.on { color:var(--text); border-top-color:var(--accent); font-weight:600; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li .nome { flex:1; word-break:break-word; }
  label.item { cursor:pointer; }
  .dot { flex:none; width:14px; height:14px; border-radius:50%; }
  input[type=checkbox] { flex:none; width:22px; height:22px; cursor:pointer; }
  .empty { color:var(--muted); padding:8px 0; }
  .qtd { color:var(--ok); }

  /* tela principal: duas metades */
  .metades { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:560px) { .metades { grid-template-columns:1fr; } }
  #banner-dia { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px; margin-bottom:16px; border:1px solid var(--accent); border-radius:10px; background:var(--card); }
  #banner-dia span { font-weight:600; }
  #banner-dia span::first-letter { text-transform:uppercase; }

  /* calendário */
  .cal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-head .mes { font-weight:600; font-size:1.1rem; }
  .cal-head .mes::first-letter { text-transform:uppercase; }
  .semana, .grade { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:4px; }
  .semana span { text-align:center; color:var(--muted); font-size:.8rem; padding-bottom:4px; }
  .cel { min-width:0; min-height:64px; padding:6px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font:inherit; display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left; cursor:default; }
  .cel.editavel { cursor:pointer; }
  .cel.hoje { outline:2px solid var(--accent); outline-offset:-1px; }
  .cel.futuro { opacity:.45; }
  .cel .n { font-size:.85rem; color:var(--muted); }
  .cel .pontos { display:flex; flex-wrap:wrap; gap:3px; }
  .cel .pontos .dot { width:10px; height:10px; }
  .branco { min-height:64px; }
  /* aba Tarefas */
  .coluna { max-width:560px; margin:0 auto; }
  .topo-tab { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  .topo-tab h2 { margin:0; }
  .tarefa-linha .principal { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .tarefa-linha .freq-t { font-weight:400; opacity:.85; font-size:.85rem; white-space:nowrap; }
  .tarefa-linha.arquivada { filter:grayscale(.75); }
  /* editor (janela para criar e editar) */
  dialog { border:1px solid var(--line); border-radius:16px; background:var(--card); color:var(--text); padding:0; width:min(440px, calc(100vw - 32px)); max-height:90vh; overflow:auto; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  .folha { padding:20px; display:grid; gap:18px; }
  .folha h3 { margin:0; font-size:1.15rem; }
  .campo { display:grid; gap:8px; font-size:.85rem; color:var(--muted); }
  .campo input[type=text], .campo input[type=number] { color:var(--text); font-size:1rem; width:100%; }
  .cores { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .sw { width:34px; height:34px; padding:0; border-radius:50%; border:0; }
  .sw.sel, #edCorCustom.sel { outline:3px solid var(--text); outline-offset:2px; }
  #edCorCustom { width:34px; height:34px; padding:0; border:0; border-radius:50%; cursor:pointer; overflow:hidden; background:conic-gradient(#ef4444, #eab308, #22c55e, #0ea5e9, #a855f7, #ec4899, #ef4444); }
  #edCorCustom::-webkit-color-swatch-wrapper { padding:0; }
  #edCorCustom::-webkit-color-swatch { border:0; border-radius:50%; opacity:0; }
  #edCorCustom::-moz-color-swatch { border:0; border-radius:50%; opacity:0; }
  .chips-op { display:flex; flex-wrap:wrap; gap:8px; }
  .chip-op { padding:8px 12px; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:999px; font-size:.9rem; }
  .chip-op.sel { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  .acoes { display:flex; gap:8px; }
  .acoes button { flex:1; }
  .acoes-extra { display:flex; gap:8px; justify-content:space-between; border-top:1px solid var(--line); padding-top:14px; }
  button.perigo { background:transparent; color:var(--err); border:1px solid var(--line); }
  #edErro { color:var(--err); margin:0; font-size:.9rem; }
  @media (max-width:560px) {
    dialog { margin:auto 0 0; width:100%; max-width:none; border-radius:16px 16px 0 0; }
    .folha { padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  }
  #tip { position:fixed; z-index:10; max-width:260px; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 6px 24px rgba(0,0,0,.25); pointer-events:none; }
  #tip .tit { font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  #tip .tit::first-letter { text-transform:uppercase; }
  #tip.aviso { border-color:var(--warn); }
  #tip.aviso .tit { color:var(--warn); font-weight:600; }
  li.item-dia { padding:0; border:0; gap:0; border-radius:10px; margin-bottom:8px; }
  li.item-dia:last-child { margin-bottom:0; }
  li.item-dia:active { filter:brightness(.92); }
  .item-dia .principal { flex:1; min-width:0; text-align:left; background:transparent; color:inherit; padding:14px; border-radius:10px; font:inherit; font-weight:600; word-break:break-word; }
  .item-dia .faltam { display:flex; align-items:center; padding:0 14px; font-size:.8rem; font-weight:600; opacity:.8; white-space:nowrap; }
  button.aviso-btn { display:flex; background:transparent; color:inherit; padding:12px 14px; }
  button.aviso-btn svg { width:20px; height:20px; }
  .freq { color:var(--muted); font-size:.85rem; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; margin:2px 4px 2px 0; font-size:.85rem; font-weight:600; }

  #msg { position:fixed; left:16px; right:16px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:6; padding:10px 14px; background:var(--card); border:1px solid var(--line); border-radius:10px; font-size:.9rem; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  #msg:empty { display:none; }
  #versao { margin-top:24px; }
  #msg.err { color:var(--err); }
  #msg.ok { color:var(--ok); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Minhas Tarefas</h1>
  </header>

  <p id="carregando" class="empty" style="margin-top:24px">Carregando…</p>

  <section id="auth" class="card" style="margin-top:24px" hidden>
    <form id="authForm">
      <p style="margin-top:0">Entre ou crie uma conta para guardar suas tarefas.</p>
      <div style="display:grid; gap:8px">
        <input id="email" type="email" placeholder="E-mail" autocomplete="email" required>
        <input id="senha" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password" minlength="6" required>
        <div style="display:flex; gap:8px">
          <button type="submit">Entrar</button>
          <button type="button" class="ghost" id="criar">Criar conta</button>
        </div>
        <button type="button" class="ghost" id="github">Entrar com GitHub</button>
      </div>
    </form>
  </section>

  <section id="app" hidden>
    <nav id="abas">
      <button data-aba="hoje"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span>Hoje</button>
      <button data-aba="calendario"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Calendário</button>
      <button data-aba="tarefas"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>Tarefas</button>
    </nav>

    <!-- HOJE: metade esquerda = a fazer, metade direita = feitas hoje -->
    <div id="banner-dia" hidden>
      <span id="banner-texto"></span>
      <button type="button" class="ghost" id="voltar-hoje">Voltar para hoje</button>
    </div>
    <div id="aba-hoje" class="metades">
      <div>
        <h2><span id="titulo-feitas">Feitas hoje</span> <span class="qtd" id="qtd-feitas"></span></h2>
        <div class="card"><ul id="lista-feitas"></ul></div>
      </div>
      <div>
        <h2>A fazer <span id="qtd-fazer"></span></h2>
        <div class="card"><ul id="lista-fazer"></ul></div>
      </div>
    </div>

    <!-- CALENDÁRIO -->
    <div id="aba-calendario" hidden>
      <div class="cal-head">
        <button class="ghost" id="mes-ant" aria-label="Mês anterior">‹</button>
        <span class="mes" id="mes-nome"></span>
        <button class="ghost" id="mes-prox" aria-label="Próximo mês">›</button>
      </div>
      <div class="semana"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
      <div class="grade" id="grade"></div>
    </div>

    <!-- TAREFAS: criar e gerenciar -->
    <div id="aba-tarefas" class="coluna" hidden>
      <div class="topo-tab">
        <h2>Tarefas</h2>
        <button type="button" id="btn-nova">+ Nova tarefa</button>
      </div>
      <ul id="lista-ativas" class="lista-tarefas"></ul>
      <div id="bloco-arquivadas" hidden>
        <h2 style="margin-top:28px">Arquivadas</h2>
        <ul id="lista-arquivadas" class="lista-tarefas"></ul>
      </div>
      <p class="freq" id="versao"></p>
    </div>
  </section>

  <div id="msg" role="status"></div>
</main>
<div id="tip" hidden></div>

<dialog id="editor">
  <form id="editorForm" class="folha" autocomplete="off">
    <h3 id="editorTitulo">Nova tarefa</h3>
    <label class="campo">Nome
      <input id="edNome" type="text" maxlength="60" placeholder="Ex.: treino" required>
    </label>
    <div class="campo">Cor
      <div class="cores" id="edCores">
        <input id="edCorCustom" type="color" title="Outra cor" aria-label="Escolher outra cor">
      </div>
    </div>
    <div class="campo">Frequência
      <div class="chips-op" id="edFreq"></div>
      <input id="edFreqDias" type="number" min="1" max="365" placeholder="A cada quantos dias?" hidden>
    </div>
    <p id="edErro" role="alert" hidden></p>
    <div class="acoes">
      <button type="button" class="ghost" id="edCancelar">Cancelar</button>
      <button type="submit" id="edSalvar">Salvar</button>
    </div>
    <div class="acoes-extra" id="edExtra" hidden>
      <button type="button" class="ghost" id="edArquivar">Arquivar</button>
      <button type="button" class="perigo" id="edApagar">Apagar</button>
    </div>
  </form>
</dialog>

<script>
// Qualquer falha de script aparece na tela (em vez de uma página vazia).
function mostrarFalha(texto) {
  const d = document.getElementById("msg");
  if (d) { d.textContent = "Erro: " + texto; d.className = "err"; }
}
window.addEventListener("error", (e) => mostrarFalha(e.message));
window.addEventListener("unhandledrejection", (e) => mostrarFalha((e.reason && e.reason.message) || String(e.reason)));
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" onerror="mostrarFalha('não consegui carregar a biblioteca do Supabase (verifique a internet)')"></script>
<script>
const SUPABASE_URL = "https://pnojsmnslhzmiizghfdh.supabase.co";
const SUPABASE_KEY = "sb_publishable_mV-yEkVoNrkL-F3nRQ5u-g_Pd-VzNNP";
// lock sem espera: o padrão usa um "lock" entre abas que, se ficar preso, deixa o app
// parado esperando a sessão (tela vazia). Para um app de uso pessoal não precisamos dele.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { lock: (_nome, _espera, fn) => fn() },
});

const VERSAO = "2026-11-10.2";
const $ = (id) => document.getElementById(id);
$("versao").textContent = "Versão " + VERSAO;
const msg = (text, kind = "") => { $("msg").textContent = text; $("msg").className = kind; };

// Dia local (não UTC), no formato YYYY-MM-DD que a coluna `date` espera.
const hojeChave = () => new Date().toLocaleDateString("sv-SE");
const pad = (n) => String(n).padStart(2, "0");
const chaveDe = (ano, mes, dia) => ano + "-" + pad(mes + 1) + "-" + pad(dia);
const rotuloDia = (chave) => new Date(chave + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });

// Texto preto ou branco: o que tiver maior razão de contraste (WCAG) com a cor da tarefa.
function corTexto(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lin = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
  const comPreto = (L + 0.05) / (0.0056 + 0.05); // #111
  const comBranco = 1.05 / (L + 0.05);
  return comPreto >= comBranco ? "#111" : "#fff";
}

const plural = (n, s) => n + " " + s + (n === 1 ? "" : "s");
const freqLabel = (n) => (n === 1 ? "todo dia" : n === 7 ? "toda semana" : "a cada " + n + " dias");
const diffDias = (de, ate) => Math.round((Date.parse(ate + "T00:00:00Z") - Date.parse(de + "T00:00:00Z")) / 864e5);

// Se a tarefa tem frequência e já passou esse tempo desde a última vez (ou desde o cadastro,
// se nunca foi feita), devolve os detalhes do atraso. Senão, null.
function situacao(t) {
  if (!t.frequencia_dias) return null;
  const feitas = state.real.filter((r) => r.tarefa_id === t.id).map((r) => r.dia).sort();
  const ultima = feitas.length ? feitas[feitas.length - 1] : null;
  const base = ultima || new Date(t.criada_em).toLocaleDateString("sv-SE");
  const dias = diffDias(base, hojeChave());
  if (dias < t.frequencia_dias) return null;
  return { dias, ultima, atraso: dias - t.frequencia_dias };
}

// Dias que faltam para a tarefa "vencer" (só para quem tem frequência e ainda não venceu).
function diasRestantes(t) {
  if (!t.frequencia_dias) return null;
  const feitas = state.real.filter((r) => r.tarefa_id === t.id).map((r) => r.dia).sort();
  const base = feitas.length ? feitas[feitas.length - 1] : new Date(t.criada_em).toLocaleDateString("sv-SE");
  const faltam = t.frequencia_dias - diffDias(base, hojeChave());
  return faltam > 0 ? faltam : null;
}

const agora = new Date();
const state = { tarefas: [], real: [], aba: "hoje", dia: null, ano: agora.getFullYear(), mes: agora.getMonth() };

const feitaNoDia = (tarefaId, dia) => state.real.some((r) => r.tarefa_id === tarefaId && r.dia === dia);
// Dia que a tela "Hoje" está mostrando: hoje, ou um dia passado escolhido no calendário.
const diaAtual = () => state.dia || hojeChave();
const ativas = () => state.tarefas.filter((t) => !t.arquivada);

function bolinha(cor) {
  const d = document.createElement("span");
  d.className = "dot";
  d.style.background = cor;
  return d;
}

function vazio(texto) {
  const e = document.createElement("div");
  e.className = "empty";
  e.textContent = texto;
  return e;
}

function botao(texto, titulo, fn, cls = "icon") {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = texto;
  b.title = titulo;
  b.addEventListener("click", fn);
  return b;
}

function itemDia(t, feito) {
  // O item inteiro é o botão: tocar move a tarefa entre "A fazer" e "Feitas hoje".
  // Fundo na cor da tarefa; texto preto ou branco, o que contrastar mais.
  const li = document.createElement("li");
  li.className = "item-dia";
  li.style.background = t.cor;
  li.style.color = corTexto(t.cor);
  const principal = document.createElement("button");
  principal.type = "button";
  principal.className = "principal";
  principal.textContent = t.nome;
  principal.setAttribute("aria-label", (feito ? "Desfazer: " : "Marcar como feita: ") + t.nome);
  principal.addEventListener("click", () => marcar(t, !feito));
  li.append(principal);
  const s = feito || state.dia ? null : situacao(t);
  const faltam = feito || state.dia || s ? null : diasRestantes(t);
  if (faltam) {
    const f = document.createElement("span");
    f.className = "faltam";
    f.textContent = faltam === 1 ? "amanhã" : "em " + faltam + " dias";
    f.title = "Próxima vez em " + plural(faltam, "dia") + " (" + freqLabel(t.frequencia_dias) + ")";
    li.append(f);
  }
  if (s) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "aviso-btn";
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/></svg>';
    b.setAttribute("aria-label", "Atenção: " + t.nome + " está pendente além da frequência");
    b.addEventListener("mouseenter", () => mostrarAviso(b, t, s));
    b.addEventListener("focus", () => mostrarAviso(b, t, s));
    b.addEventListener("click", () => mostrarAviso(b, t, s));
    b.addEventListener("mouseleave", esconderTip);
    b.addEventListener("blur", esconderTip);
    li.append(b);
  }
  return li;
}

function desenharHoje() {
  const hoje = diaAtual();
  const passado = !!state.dia;
  $("banner-dia").hidden = !passado || state.aba !== "hoje";
  $("banner-texto").textContent = passado ? "Editando " + rotuloDia(hoje) : "";
  $("titulo-feitas").textContent = passado ? "Feitas nesse dia" : "Feitas hoje";
  const as = ativas();
  // Tarefas com aviso de atraso vêm primeiro.
  const fazer = as.filter((t) => !feitaNoDia(t.id, hoje)).sort((a, b) => (situacao(b) ? 1 : 0) - (situacao(a) ? 1 : 0));
  const feitas = as.filter((t) => feitaNoDia(t.id, hoje));

  const lf = $("lista-fazer");
  lf.replaceChildren();
  if (!as.length) lf.append(vazio("Nenhuma tarefa cadastrada. Crie a primeira na aba Tarefas."));
  else if (!fazer.length) lf.append(vazio(passado ? "Tudo feito nesse dia." : "Tudo feito por hoje."));
  fazer.forEach((t) => lf.append(itemDia(t, false)));

  const ld = $("lista-feitas");
  ld.replaceChildren();
  if (!feitas.length) ld.append(vazio(passado ? "Nada feito nesse dia." : "Nada feito ainda hoje."));
  feitas.forEach((t) => ld.append(itemDia(t, true)));

  $("qtd-fazer").textContent = "(" + fazer.length + ")";
  $("qtd-feitas").textContent = "(" + feitas.length + ")";
}

// ---- calendário ----
function feitasPorDia() {
  const porId = new Map(state.tarefas.map((t) => [t.id, t]));
  const mapa = new Map();
  state.real.forEach((r) => {
    const t = porId.get(r.tarefa_id);
    if (!t) return;
    if (!mapa.has(r.dia)) mapa.set(r.dia, []);
    mapa.get(r.dia).push(t);
  });
  return mapa;
}

const tip = $("tip");
function mostrarTip(cel, chave, lista) {
  tip.className = "";
  tip.replaceChildren();
  const tit = document.createElement("div");
  tit.className = "tit";
  tit.textContent = rotuloDia(chave) + " · " + lista.length + (lista.length === 1 ? " feita" : " feitas");
  tip.append(tit);
  lista.forEach((t) => {
    const p = document.createElement("span");
    p.className = "pill";
    p.style.background = t.cor;
    p.style.color = corTexto(t.cor);
    p.textContent = t.nome;
    tip.append(p);
  });
  posicionarTip(cel);
}

function posicionarTip(cel) {
  tip.hidden = false;
  const r = cel.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
  let y = r.top - h - 8;
  if (y < 8) y = r.bottom + 8;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
const esconderTip = () => { tip.hidden = true; };
document.addEventListener("click", (e) => { if (!e.target.closest(".cel, .aviso-btn")) esconderTip(); });

function mostrarAviso(el, t, s) {
  tip.className = "aviso";
  tip.replaceChildren();
  const tit = document.createElement("div");
  tit.className = "tit";
  tit.textContent = "Atenção: " + t.nome;
  const l1 = document.createElement("div");
  l1.textContent = s.ultima
    ? "Última vez em " + s.ultima.split("-").reverse().join("/") + " (há " + plural(s.dias, "dia") + ")."
    : "Nunca foi feita (cadastrada há " + plural(s.dias, "dia") + ").";
  const l2 = document.createElement("div");
  l2.textContent = "Frequência: " + freqLabel(t.frequencia_dias) + ". " + (s.atraso > 0 ? "Atrasada em " + plural(s.atraso, "dia") + "." : "Vence hoje.");
  tip.append(tit, l1, l2);
  posicionarTip(el);
}

function desenharCalendario() {
  const nomeMes = new Date(state.ano, state.mes, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  $("mes-nome").textContent = nomeMes;
  const grade = $("grade");
  grade.replaceChildren();
  esconderTip();
  const mapa = feitasPorDia();
  const hoje = hojeChave();
  const primeiroDia = new Date(state.ano, state.mes, 1).getDay();
  const dias = new Date(state.ano, state.mes + 1, 0).getDate();

  for (let i = 0; i < primeiroDia; i++) {
    const b = document.createElement("div");
    b.className = "branco";
    grade.append(b);
  }
  for (let d = 1; d <= dias; d++) {
    const chave = chaveDe(state.ano, state.mes, d);
    const lista = mapa.get(chave) || [];
    const cel = document.createElement("button");
    cel.type = "button";
    cel.className = "cel" + (chave === hoje ? " hoje" : "") + (chave > hoje ? " futuro" : "") + (lista.length ? " tem" : "") + (chave <= hoje ? " editavel" : "");
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = d;
    cel.append(n);
    if (lista.length) {
      const pontos = document.createElement("span");
      pontos.className = "pontos";
      lista.slice(0, 8).forEach((t) => pontos.append(bolinha(t.cor)));
      cel.append(pontos);
      cel.setAttribute("aria-label", rotuloDia(chave) + ": " + lista.map((t) => t.nome).join(", "));
      cel.addEventListener("mouseenter", () => mostrarTip(cel, chave, lista));
      cel.addEventListener("focus", () => mostrarTip(cel, chave, lista));
      cel.addEventListener("mouseleave", esconderTip);
      cel.addEventListener("blur", esconderTip);
    }
    // Tocar num dia (hoje ou passado) abre a tela principal naquele dia, para marcar ou desmarcar.
    if (chave <= hoje) cel.addEventListener("click", () => abrirDia(chave));
    grade.append(cel);
  }
}

// ---- gerenciar tarefas ----
// Cada tarefa é um bloco na cor dela; tocar abre o editor.
function linhaTarefa(t) {
  const li = document.createElement("li");
  li.className = "item-dia tarefa-linha";
  li.style.background = t.cor;
  li.style.color = corTexto(t.cor);
  const b = document.createElement("button");
  b.type = "button";
  b.className = "principal";
  b.setAttribute("aria-label", "Editar " + t.nome);
  const nome = document.createElement("span");
  nome.textContent = t.nome;
  b.append(nome);
  if (t.frequencia_dias) {
    const f = document.createElement("small");
    f.className = "freq-t";
    f.textContent = freqLabel(t.frequencia_dias);
    b.append(f);
  }
  b.addEventListener("click", () => abrirEditor(t));
  li.append(b);
  return li;
}

function desenharTarefas() {
  const a = $("lista-ativas");
  a.replaceChildren();
  const ativasLista = ativas();
  if (!ativasLista.length) a.append(vazio("Nenhuma tarefa ainda. Toque em “Nova tarefa”."));
  ativasLista.forEach((t) => a.append(linhaTarefa(t)));

  const arq = state.tarefas.filter((t) => t.arquivada);
  $("bloco-arquivadas").hidden = !arq.length;
  const l = $("lista-arquivadas");
  l.replaceChildren();
  arq.forEach((t) => {
    const li = linhaTarefa(t);
    li.classList.add("arquivada");
    l.append(li);
  });
}

function desenhar() {
  document.querySelectorAll("#abas button").forEach((b) => b.classList.toggle("on", b.dataset.aba === state.aba));
  ["hoje", "calendario", "tarefas"].forEach((a) => { $("aba-" + a).hidden = a !== state.aba; });
  desenharHoje();
  desenharTarefas();
  if (state.aba === "calendario") desenharCalendario();
}

async function carregar() {
  const [t, r] = await Promise.all([
    sb.from("tarefas").select("*").order("criada_em", { ascending: true }),
    sb.from("realizacoes").select("tarefa_id, dia"),
  ]);
  const erro = t.error || r.error;
  if (erro) return msg("Erro ao carregar: " + erro.message + " (você já rodou o schema.sql?)", "err");
  msg("");
  state.tarefas = t.data;
  state.real = r.data;
  desenhar();
}

async function marcar(t, feito) {
  const dia = diaAtual();
  const { error } = feito
    ? await sb.from("realizacoes").insert({ tarefa_id: t.id, dia })
    : await sb.from("realizacoes").delete().eq("tarefa_id", t.id).eq("dia", dia);
  if (error) msg("Erro ao salvar: " + error.message, "err");
  carregar();
}

async function atualizar(t, campos) {
  const { error } = await sb.from("tarefas").update(campos).eq("id", t.id);
  if (error) msg("Erro ao atualizar: " + error.message, "err");
  carregar();
}

async function apagar(t) {
  if (!confirm('Apagar "' + t.nome + '" e todo o histórico dela? Isso não pode ser desfeito.')) return;
  const { error } = await sb.from("tarefas").delete().eq("id", t.id);
  if (error) msg("Erro ao apagar: " + error.message, "err");
  carregar();
}

function abrirDia(chave) {
  state.dia = chave === hojeChave() ? null : chave;
  state.aba = "hoje";
  esconderTip();
  desenhar();
  window.scrollTo(0, 0);
}
$("voltar-hoje").addEventListener("click", () => abrirDia(hojeChave()));

$("abas").addEventListener("click", (e) => {
  const a = e.target.closest("button")?.dataset.aba;
  if (!a) return;
  if (a === "hoje") state.dia = null; // a aba "Hoje" sempre mostra hoje
  state.aba = a; esconderTip(); desenhar();
});

function mudarMes(delta) {
  const d = new Date(state.ano, state.mes + delta, 1);
  state.ano = d.getFullYear();
  state.mes = d.getMonth();
  desenharCalendario();
}
$("mes-ant").addEventListener("click", () => mudarMes(-1));
$("mes-prox").addEventListener("click", () => mudarMes(1));

// ---- editor de tarefa (criar e editar) ----
const PALETA = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#14b8a6", "#0ea5e9", "#3b82f6", "#a855f7", "#ec4899", "#64748b"];
const FREQS = [[null, "Sem"], [1, "Todo dia"], [2, "2 dias"], [3, "3 dias"], [7, "Semana"], [14, "2 semanas"], [30, "Mês"]];
const ed = { tarefa: null, cor: PALETA[5], freq: null, outro: false };
const erroEditor = (texto) => { $("edErro").textContent = texto; $("edErro").hidden = !texto; };

function desenharEditor() {
  const cores = $("edCores");
  cores.querySelectorAll(".sw").forEach((b) => b.remove());
  PALETA.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "sw" + (c === ed.cor ? " sel" : "");
    b.style.background = c;
    b.setAttribute("aria-label", "Cor " + c);
    b.addEventListener("click", () => { ed.cor = c; desenharEditor(); });
    cores.insertBefore(b, $("edCorCustom"));
  });
  $("edCorCustom").value = ed.cor;
  $("edCorCustom").classList.toggle("sel", !PALETA.includes(ed.cor));
  // Arco-íris enquanto não há cor personalizada; depois mostra a cor escolhida.
  $("edCorCustom").style.background = PALETA.includes(ed.cor) ? "" : ed.cor;

  const f = $("edFreq");
  f.replaceChildren();
  FREQS.forEach(([valor, rotulo]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip-op" + (!ed.outro && ed.freq === valor ? " sel" : "");
    b.textContent = rotulo;
    b.addEventListener("click", () => { ed.freq = valor; ed.outro = false; desenharEditor(); });
    f.append(b);
  });
  const outro = document.createElement("button");
  outro.type = "button";
  outro.className = "chip-op" + (ed.outro ? " sel" : "");
  outro.textContent = "Outro";
  outro.addEventListener("click", () => { ed.outro = true; desenharEditor(); $("edFreqDias").focus(); });
  f.append(outro);
  $("edFreqDias").hidden = !ed.outro;
}

function abrirEditor(t) {
  ed.tarefa = t || null;
  ed.cor = t ? t.cor : PALETA[5];
  ed.freq = t ? t.frequencia_dias : null;
  ed.outro = !!t && t.frequencia_dias != null && !FREQS.some(([v]) => v === t.frequencia_dias);
  $("editorTitulo").textContent = t ? "Editar tarefa" : "Nova tarefa";
  $("edNome").value = t ? t.nome : "";
  $("edFreqDias").value = ed.outro ? t.frequencia_dias : "";
  $("edExtra").hidden = !t;
  if (t) $("edArquivar").textContent = t.arquivada ? "Restaurar" : "Arquivar";
  erroEditor("");
  desenharEditor();
  $("editor").showModal();
  if (t) $("edNome").blur(); // ao editar, não abre o teclado sozinho
}

$("btn-nova").addEventListener("click", () => abrirEditor(null));
$("edCancelar").addEventListener("click", () => $("editor").close());
$("editor").addEventListener("click", (e) => { if (e.target === $("editor")) $("editor").close(); });
$("edCorCustom").addEventListener("input", (e) => { ed.cor = e.target.value; desenharEditor(); });

$("editorForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nome = $("edNome").value.trim();
  if (!nome) return;
  let freq = ed.freq;
  if (ed.outro) {
    freq = parseInt($("edFreqDias").value, 10);
    if (!(freq >= 1 && freq <= 365)) return erroEditor("Frequência: use um número de 1 a 365 dias.");
  }
  const campos = { nome, cor: ed.cor, frequencia_dias: freq };
  $("edSalvar").disabled = true;
  const { error } = ed.tarefa
    ? await sb.from("tarefas").update(campos).eq("id", ed.tarefa.id)
    : await sb.from("tarefas").insert(campos);
  $("edSalvar").disabled = false;
  if (error) return erroEditor("Erro ao salvar: " + error.message);
  $("editor").close();
  carregar();
});

$("edArquivar").addEventListener("click", () => {
  const t = ed.tarefa;
  $("editor").close();
  atualizar(t, { arquivada: !t.arquivada });
});

$("edApagar").addEventListener("click", () => {
  const t = ed.tarefa;
  $("editor").close();
  apagar(t); // pede confirmação antes de apagar
});

$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("senha").value });
  if (error) msg("Não foi possível entrar: " + error.message, "err");
});

$("criar").addEventListener("click", async () => {
  if (!$("authForm").reportValidity()) return;
  const { data, error } = await sb.auth.signUp({ email: $("email").value, password: $("senha").value });
  if (error) return msg("Não foi possível criar a conta: " + error.message, "err");
  if (!data.session) msg("Conta criada. Confirme pelo link enviado ao seu e-mail e depois clique em Entrar.", "ok");
});

// Na primeira vez, o Supabase cria a conta sozinho a partir do GitHub.
$("github").addEventListener("click", async () => {
  const { error } = await sb.auth.signInWithOAuth({
    provider: "github",
    options: { redirectTo: window.location.origin + window.location.pathname },
  });
  if (error) msg("Não foi possível entrar com o GitHub: " + error.message, "err");
});

function mostrar(session) {
  $("carregando").hidden = true;
  $("auth").hidden = !!session;
  $("app").hidden = !session;
  if (session) {
    carregar();
  } else {
    state.tarefas = [];
    state.real = [];
  }
}

let iniciou = false;
const iniciar = (session) => { iniciou = true; mostrar(session); };
sb.auth.onAuthStateChange((_evento, session) => iniciar(session));
sb.auth.getSession()
  .then(({ data }) => iniciar(data.session))
  .catch((e) => { msg("Erro ao restaurar a sessão: " + e.message, "err"); iniciar(null); });
// Se a sessão demorar demais, mostra o login em vez de ficar em branco.
setTimeout(() => {
  if (iniciou) return;
  msg("Demorou para restaurar sua sessão. Entre de novo.", "err");
  iniciar(null);
}, 6000);

if ("serviceWorker" in navigator) {
  // Se já havia um service worker e chegou uma versão nova, recarrega uma vez para usá-la.
  const tinhaControle = !!navigator.serviceWorker.controller;
  let recarregou = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!tinhaControle || recarregou) return;
    recarregou = true;
    location.reload();
  });
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
